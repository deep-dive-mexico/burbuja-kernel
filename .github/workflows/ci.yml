name: Kernel source validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Install the validated image (otherwise verify AWS authentication only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the next stable release commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/github-release.py prepare
  build-and-unit:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Check official committed source boundary
        run: python3 scripts/release-source.py --check
      - name: Check declared version against the release line
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/kernel-version.py check --ref "refs/tags/$RELEASE_TAG"
          else
            python3 scripts/kernel-version.py check
          fi
      - name: Check GitHub release identity
        run: python3 scripts/github-release.py check
      - name: Check release boundary regressions
        run: python3 -m unittest discover -s tests/deployment
      - name: Build source and Workbench example
        run: |
          dotnet build Burbuja.slnx -c Release -m:1
          dotnet build examples/Example.Workbench/Example.Workbench.slnx -c Release -m:1
      - name: Run generic unit projects
        run: python3 scripts/test-kernel.py
  release:
    needs: [prepare-release, build-and-unit]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Publish GitHub release for the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: python3 scripts/github-release.py publish --title-prefix "Burbuja kernel"
  deploy:
    needs: [prepare-release, build-and-unit, release]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://kernel.dive.ai/portal
    env:
      AWS_REGION: us-west-2
      AWS_APPLICATION: kernel
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_DEPLOY_INSTANCE: ${{ vars.AWS_DEPLOY_INSTANCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Configure environment-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify short-lived deployment credentials
        run: |
          aws sts get-caller-identity > /dev/null
          echo "OIDC deployment authentication verified."
      - name: Install deployment dependencies
        if: github.event_name == 'push' || inputs.deploy
        run: |
          python3 -m venv "$RUNNER_TEMP/kernel-deploy-venv"
          "$RUNNER_TEMP/kernel-deploy-venv/bin/python" -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Build, publish and deploy immutable image
        if: github.event_name == 'push' || inputs.deploy
        run: '"$RUNNER_TEMP/kernel-deploy-venv/bin/python" scripts/aws-release.py'
