name: Kernel source validation
on:
  push:
    # Feature branches validate through pull_request once; both events otherwise
    # run duplicate generic validation campaigns for one change.
    branches: [dev, main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Install the validated image (otherwise verify AWS authentication only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the next stable release commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/github-release.py prepare
  build-and-unit:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Check official committed source boundary
        run: python3 scripts/release-source.py --check
      - name: Check declared version against the release line
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/kernel-version.py check --ref "refs/tags/$RELEASE_TAG"
          else
            python3 scripts/kernel-version.py check
          fi
      - name: Check GitHub release identity
        run: python3 scripts/github-release.py check
      - name: Check release boundary regressions
        run: python3 -m unittest discover -s tests/deployment
      - name: Build source and Workbench example
        run: |
          dotnet build Burbuja.slnx -c Release -m:1
          dotnet build examples/Example.Workbench/Example.Workbench.slnx -c Release -m:1
      - name: Run generic unit projects
        run: python3 scripts/test-kernel.py
      - name: Run public HTTP and restart journeys
        run: |
          python3 scripts/test-e2e.py http
          python3 scripts/test-e2e.py own-host
      - name: Install Chromium and verify the generic console
        run: |
          python3 scripts/test-e2e.py install-browser
          python3 scripts/test-e2e.py browser
      - uses: actions/upload-artifact@v4
        id: kernel-diagnostics
        if: always()
        continue-on-error: true
        with:
          name: kernel-e2e-diagnostics
          retention-days: 7
          path: |
            artifacts/e2e-runs/
            artifacts/e2e-logs/
            artifacts/e2e-browser/
      - name: Report unavailable kernel diagnostic storage
        if: ${{ always() && steps.kernel-diagnostics.outcome == 'failure' }}
        run: echo "::warning::Artifact upload failed; kernel test outcomes remain in workflow logs."
  consumer-akos:
    needs: [prepare-release, build-and-unit]
    # Private source and credentials are available only on trusted push/manual runs.
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        product-ref: [dev, main]
    timeout-minutes: 90
    env:
      KERNEL_COMMIT: ${{ needs.prepare-release.outputs.sha || github.sha }}
      BURBUJA_PORT_MIN: "18400"
      BURBUJA_PORT_MAX: "18474"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deep-dive-mexico/akos-server
          ref: ${{ matrix.product-ref }}
          path: akos
          ssh-key: ${{ secrets.AKOS_READ_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Run the complete private consumer suite
        working-directory: akos
        run: |
          # Raw product output stays on this disposable VM and is never uploaded.
          python3 scripts/test-product.py install-browser > "$RUNNER_TEMP/consumer-install.log" 2>&1
          python3 ../kernel/scripts/consumer-gate.py --kernel-root ../kernel --kernel-commit "$KERNEL_COMMIT" > "$RUNNER_TEMP/consumer-gate.log" 2>&1
      - name: Report consumer test counts without private diagnostics
        if: always()
        run: |
          python3 - <<'REPORT'
          import json
          from pathlib import Path
          path = Path("akos/artifacts/kernel-compatibility/consumer-gate-summary.json")
          if not path.is_file():
              raise SystemExit("Consumer gate did not produce a summary; private output was not published.")
          summary = json.loads(path.read_text())
          for lane in ("unit", "http", "own-host", "browser"):
              counts = summary.get("lanes", {}).get(lane, {}).get("results", {})
              print(lane, {key: int(counts.get(key, 0)) for key in ("total", "passed", "failed", "notExecuted", "aborted")})
          if summary.get("status") != "passed":
              raise SystemExit("Consumer compatibility failed; diagnose in private automation.")
          REPORT
  release:
    needs: [prepare-release, build-and-unit, consumer-akos]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && needs.consumer-akos.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Publish GitHub release for the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: python3 scripts/github-release.py publish --title-prefix "Burbuja kernel"
  deploy:
    needs: [prepare-release, build-and-unit, consumer-akos, release]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && needs.consumer-akos.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    # main deploys production; dev deploys the dev tenant. The dev environment admits
    # only branch dev and overrides AWS_DEPLOY_INSTANCE; the host also checks its tenant.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://kernel.dive.ai/portal' || 'https://kernel-dev.dive.ai/portal' }}
    env:
      AWS_REGION: us-west-2
      AWS_APPLICATION: kernel
      AWS_TENANT: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_DEPLOY_INSTANCE: ${{ vars.AWS_DEPLOY_INSTANCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Configure environment-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify short-lived deployment credentials
        run: |
          aws sts get-caller-identity > /dev/null
          echo "OIDC deployment authentication verified."
      - name: Install deployment dependencies
        if: github.event_name == 'push' || inputs.deploy
        run: |
          python3 -m venv "$RUNNER_TEMP/kernel-deploy-venv"
          "$RUNNER_TEMP/kernel-deploy-venv/bin/python" -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Build, publish and deploy immutable image
        if: github.event_name == 'push' || inputs.deploy
        run: '"$RUNNER_TEMP/kernel-deploy-venv/bin/python" scripts/aws-release.py'
