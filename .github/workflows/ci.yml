name: Kernel source validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Install the validated image (otherwise verify AWS authentication only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Check official committed source boundary
        run: python3 scripts/release-source.py --check
      - name: Check release boundary regressions
        run: python3 -m unittest discover -s tests/deployment
      - name: Build source and Workbench example
        run: |
          dotnet build Burbuja.slnx -c Release -m:1
          dotnet build examples/Example.Workbench/Example.Workbench.slnx -c Release -m:1
      - name: Run generic unit projects
        run: python3 scripts/test-kernel.py
  deploy:
    needs: build-and-unit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://kernel.dive.ai/portal
    env:
      AWS_REGION: us-west-2
      AWS_APPLICATION: kernel
      AWS_ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
      AWS_RELEASE_BUCKET: ${{ secrets.AWS_RELEASE_BUCKET }}
      AWS_DEPLOY_INSTANCE: ${{ secrets.AWS_DEPLOY_INSTANCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure environment-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify short-lived deployment credentials
        run: |
          aws sts get-caller-identity > /dev/null
          echo "OIDC deployment authentication verified."
      - name: Install deployment dependencies
        if: github.event_name == 'push' || inputs.deploy
        run: |
          python3 -m venv "$RUNNER_TEMP/kernel-deploy-venv"
          "$RUNNER_TEMP/kernel-deploy-venv/bin/python" -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Build, publish and deploy immutable image
        if: github.event_name == 'push' || inputs.deploy
        run: '"$RUNNER_TEMP/kernel-deploy-venv/bin/python" scripts/aws-release.py'
