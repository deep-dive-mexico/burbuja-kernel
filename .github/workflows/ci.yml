name: Kernel source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Release jobs only call the GitHub API; their own runner keeps them from queueing behind validation.
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","dive-release"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the next stable release commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/github-release.py prepare
  build-and-unit:
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    # Code under test runs on the CI runner, which has no AWS authority; only deploy uses dive-kernel.
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","dive-ci"]') }}
    timeout-minutes: 45
    env:
      DOTNET_INSTALL_DIR: /home/runner/.dotnet-kernel
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Check official committed source boundary
        run: python3 scripts/release-source.py --check
      - name: Check declared version against the release line
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/kernel-version.py check --ref "refs/tags/$RELEASE_TAG"
          else
            python3 scripts/kernel-version.py check
          fi
      - name: Check GitHub release identity
        run: python3 scripts/github-release.py check
      - name: Check release boundary regressions
        run: python3 -m unittest discover -s tests/deployment
      - name: Build source and Workbench example
        run: |
          dotnet build Burbuja.slnx -c Release -m:1
          dotnet build examples/Example.Workbench/Example.Workbench.slnx -c Release -m:1
      - name: Run generic unit projects
        run: python3 scripts/test-kernel.py
      - name: Run public HTTP and restart journeys
        run: |
          python3 scripts/test-e2e.py http
          python3 scripts/test-e2e.py own-host
      - name: Install Chromium and verify the generic console
        run: |
          python3 scripts/test-e2e.py install-browser
          python3 scripts/test-e2e.py browser
      - uses: actions/upload-artifact@v4
        id: kernel-diagnostics
        if: always()
        continue-on-error: true
        with:
          name: kernel-e2e-diagnostics
          retention-days: 7
          path: |
            artifacts/e2e-runs/
            artifacts/e2e-logs/
            artifacts/e2e-browser/
      - name: Report unavailable kernel diagnostic storage
        if: ${{ always() && steps.kernel-diagnostics.outcome == 'failure' }}
        run: echo "::warning::Artifact upload failed; kernel test outcomes remain in workflow logs."
  consumer-akos:
    needs: [prepare-release, build-and-unit]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' }}
    # Validate both the development and production source lines of the first consumer.
    # Its complete offline product suite (units, HTTP,
    # owned-process restarts, Chromium journeys) runs against this exact kernel commit through the
    # product's own non-deployable candidate harness, so a generic change that would regress the
    # product fails here before a release is published or a tenant deployed. The deploy key is
    # read-only and scoped to the product repository alone (docs/releases.md, "Consumer gate").
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","dive-ci"]') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        product-ref: [dev, main]
    # Includes up to an hour waiting for the host-wide AKOS lane lock below.
    timeout-minutes: 120
    env:
      DOTNET_INSTALL_DIR: /home/runner/.dotnet-akos
      KERNEL_COMMIT: ${{ needs.prepare-release.outputs.sha || github.sha }}
      # The product's own CI shares this host and claims loopback ports 18025-18099 for its hosts;
      # a second checkout cannot see those claims, and two Hosts on one port route requests to the
      # wrong kernel (first live gate run, 2026-10-07). This job keeps a disjoint band.
      BURBUJA_PORT_MIN: "18400"
      BURBUJA_PORT_MAX: "18474"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deep-dive-mexico/akos-server
          ref: ${{ matrix.product-ref }}
          path: akos
          ssh-key: ${{ secrets.AKOS_READ_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Run the complete AKOS product suite against this kernel commit
        working-directory: akos
        run: |
          git -C ../kernel remote set-url origin https://github.com/deep-dive-mexico/burbuja-kernel.git
          echo "AKOS ${{ matrix.product-ref }} source: $(git rev-parse HEAD)"
          # The product's own CI runner shares this 4-vCPU host and its lanes hold the same lock, so
          # two AKOS suites never run at once: concurrent Chromium lanes starved each other into
          # 20-30 s timeouts on the second live gate run (2026-10-07). The Chromium install runs
          # inside the lock too (its apt step cannot share dpkg). A lock timeout exits 75, not 1.
          # One retry requires fresh, source-matched evidence of executed browser failures.
          # The aggregate gate receipt retains the four final lanes and both attempts.
          # shellcheck disable=SC2016
          flock -E 75 --verbose --timeout 3600 /home/runner/dive-akos-lanes.lock \
            bash -eo pipefail -c 'python3 scripts/test-product.py install-browser \
              && python3 ../kernel/scripts/consumer-gate.py --kernel-root ../kernel --kernel-commit "$KERNEL_COMMIT"'
      - uses: actions/upload-artifact@v4
        id: consumer-diagnostics
        if: always()
        continue-on-error: true
        with:
          name: akos-consumer-compatibility-${{ matrix.product-ref }}
          retention-days: 7
          path: |
            akos/artifacts/kernel-compatibility/consumer-gate-summary.json
            akos/artifacts/kernel-compatibility/candidate-*/.kernel-candidate-test-only.json
            akos/artifacts/kernel-compatibility/candidate-*/*.log
            akos/artifacts/kernel-compatibility/candidate-*/artifacts/diag/
          include-hidden-files: true
      - name: Report unavailable consumer diagnostic storage
        if: ${{ always() && steps.consumer-diagnostics.outcome == 'failure' }}
        run: echo "::warning::Artifact upload failed; source-bound consumer receipts remain in workflow logs."
  release:
    needs: [prepare-release, build-and-unit, consumer-akos]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && needs.consumer-akos.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    # Release jobs only call the GitHub API; their own runner keeps them from queueing behind validation.
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","dive-release"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Publish GitHub release for the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: python3 scripts/github-release.py publish --title-prefix "Burbuja kernel"
  deploy:
    needs: [prepare-release, build-and-unit, consumer-akos, release]
    if: ${{ !cancelled() && needs.build-and-unit.result == 'success' && needs.consumer-akos.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request' }}
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","dive-kernel"]') }}
    timeout-minutes: 40
    # main deploys production; dev deploys the dev tenant. The dev environment admits
    # only branch dev and overrides AWS_DEPLOY_INSTANCE; the host also checks its tenant.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://kernel.dive.ai/portal' || 'https://kernel-dev.dive.ai/portal' }}
    env:
      AWS_REGION: us-west-2
      AWS_APPLICATION: kernel
      AWS_TENANT: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_DEPLOY_INSTANCE: ${{ vars.AWS_DEPLOY_INSTANCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Build, publish and deploy immutable image
        run: /opt/dive/venv/bin/python scripts/aws-release.py
