name: kernel-prod
services:
  app:
    image: ${APP_IMAGE:?provide an immutable ECR digest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: /etc/dive/app.env
        format: raw
    ports:
      - "8080:8080"
    volumes:
      - state:/var/burbuja/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 12
volumes:
  state:
    # The installer names each tenant's volume; releases built before tenants keep production's.
    name: ${APP_STATE_VOLUME:-kernel-prod-state}
